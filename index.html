<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جان‌مایه — نشانی جدید</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0E1519">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="جان‌مایه — نشانی جدید">
<meta property="og:description" content="این سایت به نشانی جدید منتقل شده — جان‌مایه.">
<meta property="og:url" content="https://aminmirr.github.io/book-podcasts/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,500;1,6..72,300&family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1519; --ink-raise:#141E24; --line:#23313A;
  --paper:#EDEAE3; --haze:#7E909C; --saffron:#E0A458;
  --gutter:clamp(20px,5vw,64px);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--ink); }
body{
  background:var(--ink); color:var(--paper);
  font-family:'Vazirmatn',system-ui,sans-serif; font-weight:300; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding-inline:var(--gutter); padding-block:48px;
}
.wrap{ max-width:560px; text-align:center; }
.mark{ font-family:'Vazirmatn',sans-serif; font-weight:800; font-size:1.1rem;
  color:var(--saffron); margin-bottom:28px; }
.headline{ font-family:'Vazirmatn',sans-serif; font-weight:800;
  font-size:clamp(1.7rem,5vw,2.6rem); line-height:1.4; letter-spacing:-.01em; }
.standfirst{ color:var(--haze); margin-top:18px; font-size:1rem; line-height:1.8; }
.go{ display:inline-flex; align-items:center; gap:10px; margin-top:36px;
  font:inherit; font-weight:800; font-size:1.05rem; cursor:pointer; text-decoration:none;
  background:var(--saffron); color:var(--ink); border:1px solid var(--saffron);
  border-radius:999px; padding:16px 32px; transition:filter .2s; }
.go:hover{ filter:brightness(1.08); }
.go:focus-visible{ outline:2px solid var(--saffron); outline-offset:3px; }
.go svg{ width:14px; height:14px; fill:currentColor; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">جان‌مایه</div>
  <h1 class="headline">جان‌مایه شدیم — این سایت به نشانی جدید منتقل شده</h1>
  <p class="standfirst">خلاصه‌های صوتی کتاب‌ها، از همین جا به نشانی جدید منتقل شده‌اند. برای شنیدن، به آدرس جدید برو.</p>
  <a class="go" id="go" href="https://aminmirr.github.io/janmaye/">
    <span>رفتن به جان‌مایه</span>
    <svg viewBox="0 0 16 16"><path d="M3 2v12l8-6zM11.4 2H13v12h-1.6z"/></svg>
  </a>
</div>
<script>
// Preserve a deep link (#slug or #slug/chapter) so a bookmarked chapter
// still lands on the right place at the new address.
if(location.hash) document.getElementById("go").href = "https://aminmirr.github.io/janmaye/" + location.hash;
</script>
</body>
</html>
