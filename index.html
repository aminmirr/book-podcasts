<!DOCTYPE html>
<html lang="fa" dir="rtl" data-lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خلاصه‌های صوتی کتاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,500;1,6..72,300&family=Vazirmatn:wght@300;500;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1519; --ink-raise:#141E24; --line:#23313A;
  --paper:#EDEAE3; --haze:#7E909C;
  --verdigris:#57A99B; --saffron:#E0A458;
  --accent:var(--verdigris);
  --gutter:clamp(20px,5vw,64px);
  --bar-h:76px;
}
html[data-lang="fa"]{ --accent:var(--saffron); }
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--ink); scroll-behavior:smooth; }
body{
  background:var(--ink); color:var(--paper);
  font-family:'Vazirmatn',system-ui,sans-serif; font-weight:300; line-height:1.7;
  -webkit-font-smoothing:antialiased; padding-bottom:var(--bar-h);
}
body.has-player{ padding-bottom:calc(var(--bar-h) + 24px); }
.wrap{ max-width:1000px; margin-inline:auto; padding-inline:var(--gutter); }

.mono{ font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:400;
  font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; }
html[data-lang="fa"] .mono{ font-family:'Vazirmatn',sans-serif; letter-spacing:0;
  text-transform:none; font-size:.78rem; }
.num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

/* masthead */
.masthead{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:26px 0; }
.mark{ display:flex; align-items:center; gap:10px; color:var(--haze); }
.mark-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); transition:background .45s ease; }
.langswitch{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--ink-raise); }
.langswitch button{ font:inherit; background:none; border:0; cursor:pointer; color:var(--haze);
  padding:7px 16px; font-size:.8rem; transition:color .2s,background .2s; }
.langswitch button[aria-pressed="true"]{ color:var(--ink); background:var(--accent); }
.langswitch button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* hero */
.hero{ padding-block:clamp(52px,10vw,100px) clamp(36px,6vw,64px); }
.eyebrow{ color:var(--haze); margin-bottom:22px; }
.headline{ font-family:'Newsreader',Georgia,serif; font-weight:300;
  font-size:clamp(2.2rem,6vw,4.2rem); line-height:1.07; letter-spacing:-.015em;
  max-width:18ch; text-wrap:balance; }
html[data-lang="fa"] .headline{ font-family:'Vazirmatn',sans-serif; font-weight:800;
  font-size:clamp(1.8rem,5vw,3.3rem); line-height:1.34; letter-spacing:-.01em; max-width:22ch; }
.headline em{ font-style:italic; color:var(--accent); transition:color .45s ease; }
html[data-lang="fa"] .headline em{ font-style:normal; }
.standfirst{ color:var(--haze); margin-top:22px; max-width:52ch; font-size:1.02rem; }

.stats{ display:flex; flex-wrap:wrap; gap:14px 44px; margin-top:clamp(36px,6vw,56px);
  padding-top:26px; border-top:1px solid var(--line); }
.stat b{ display:block; font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;
  font-weight:500; font-size:1.5rem; color:var(--paper); line-height:1.3; }
html[data-lang="fa"] .stat b{ font-family:'Vazirmatn',sans-serif; font-weight:800; }
.stat span{ color:var(--haze); }
.stat.is-key b{ color:var(--accent); transition:color .45s ease; }

/* book */
.book{ padding-block:clamp(30px,4.5vw,44px); border-bottom:1px solid var(--line); }
.book-top{ display:grid; grid-template-columns:1fr auto; gap:20px 28px; align-items:start; }
.book-id{ display:flex; gap:clamp(14px,3vw,22px); align-items:flex-start; min-width:0; }
.cover{ width:clamp(58px,11vw,92px); aspect-ratio:2/3; object-fit:cover; flex:none;
  border-radius:3px; border:1px solid var(--line); background:var(--ink-raise);
  box-shadow:0 1px 0 0 color-mix(in srgb,var(--paper) 8%,transparent) inset; }
.titles{ min-width:0; }
/* English title: always the bold serif display line */
.book-title-en{ font-family:'Newsreader',Georgia,serif; font-weight:500;
  font-size:clamp(1.35rem,3vw,1.95rem); line-height:1.18; letter-spacing:-.01em; }
.book-title-fa{ font-family:'Vazirmatn',sans-serif; font-weight:500; direction:rtl;
  font-size:clamp(1rem,2.2vw,1.28rem); line-height:1.5; margin-top:5px;
  color:color-mix(in srgb,var(--paper) 82%,var(--ink)); }
.book-author{ color:var(--haze); margin-top:10px; font-size:.9rem; }
.book-author::before{ content:"—  "; opacity:.6; }
.book-note{ margin-top:14px; max-width:60ch; font-size:.95rem;
  color:color-mix(in srgb,var(--paper) 74%,var(--ink)); }

/* categories — filter bar + per-book chips */
.cats{ display:flex; flex-wrap:wrap; gap:9px; padding-block:8px 0; }
.cats[hidden]{ display:none; }
.cat{ font:inherit; font-size:.8rem; cursor:pointer; background:none;
  color:var(--haze); border:1px solid var(--line); border-radius:999px;
  padding:6px 14px; transition:color .2s,border-color .2s,background .2s; }
.cat:hover{ color:var(--paper); border-color:var(--haze); }
.cat[aria-pressed="true"]{ color:var(--ink); background:var(--accent); border-color:var(--accent); }
.cat:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
html[data-lang="fa"] .cat{ font-family:'Vazirmatn',sans-serif; }
.book-cats{ display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
.book-cats .cat{ font-size:.72rem; padding:4px 11px; }

/* whole-book: play + download side by side */
.book-side{ display:flex; gap:10px; align-items:center; }
.whole-dl{ display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; flex:none; color:var(--haze); text-decoration:none;
  border:1px solid var(--line); border-radius:999px; transition:color .2s,border-color .2s; }
.whole-dl:hover{ color:var(--accent); border-color:var(--accent); }
.whole-dl:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.whole-dl svg{ width:14px; height:14px; fill:currentColor; }

/* like / dislike */
.votes{ display:flex; gap:8px; margin-top:14px; }
.vote{ font:inherit; font-size:.8rem; cursor:pointer; background:none; color:var(--haze);
  border:1px solid var(--line); border-radius:999px; padding:5px 13px;
  display:inline-flex; align-items:center; gap:7px;
  transition:color .2s,border-color .2s,background .2s; }
.vote:hover{ color:var(--paper); border-color:var(--haze); }
.vote[aria-pressed="true"]{ color:var(--accent); border-color:var(--accent); }
.vote:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.vote .num{ font-size:.78rem; min-width:1ch; text-align:center; }
.vote svg{ width:11px; height:11px; fill:currentColor; }

/* suggestion sheet */
dialog.sheet{ border:1px solid var(--line); border-radius:14px; background:var(--ink-raise);
  color:var(--paper); padding:0; max-width:440px; width:calc(100% - 32px);
  margin:auto; }   /* the *{margin:0} reset kills native centering — restore it */
dialog.sheet::backdrop{ background:rgba(6,10,12,.6); backdrop-filter:blur(3px); }
.sheet-close{ position:absolute; inset-block-start:12px; inset-inline-end:12px; z-index:2;
  width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center;
  background:none; border:0; border-radius:50%; cursor:pointer; color:var(--haze);
  transition:color .2s,background .2s; }
.sheet-close:hover{ color:var(--paper); background:color-mix(in srgb,var(--paper) 8%,transparent); }
.sheet-close:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.sheet-close svg{ width:14px; height:14px; fill:currentColor; }
.sheet-panel h3{ padding-inline-end:28px; }   /* room for the × */
.sheet-panel{ padding:clamp(20px,4vw,30px); display:flex; flex-direction:column; gap:14px; }
.sheet-panel[hidden]{ display:none; }
.sheet h3{ font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:1.4rem; }
html[data-lang="fa"] .sheet h3{ font-family:'Vazirmatn',sans-serif; font-weight:800; }
.sheet-lead{ color:var(--haze); font-size:.92rem; margin-top:-4px; }
.sheet label{ display:flex; flex-direction:column; gap:5px; font-size:.82rem; color:var(--haze); }
.sheet input,.sheet textarea{ font:inherit; font-size:.95rem; color:var(--paper);
  background:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 12px; }
.sheet input:focus,.sheet textarea:focus{ outline:none; border-color:var(--accent); }
.sheet textarea{ resize:vertical; min-height:64px; }
.sheet-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
.sheet-actions.col{ flex-direction:column; margin-top:6px; }
.sheet-actions button,.sheet-actions a{ font:inherit; cursor:pointer; border-radius:999px;
  padding:11px 18px; font-size:.9rem; text-decoration:none; text-align:center;
  display:inline-flex; align-items:center; justify-content:center; gap:9px; }
.sheet-actions.col button,.sheet-actions.col a{ width:100%; }
html[data-lang="fa"] .sheet-actions button,html[data-lang="fa"] .sheet-actions a{ font-family:'Vazirmatn',sans-serif; }
.btn-ghost{ background:none; color:var(--haze); border:1px solid var(--line); }
.btn-ghost:hover{ color:var(--paper); border-color:var(--haze); }
.btn-primary{ background:var(--accent); color:var(--ink); border:1px solid var(--accent); font-weight:500; }
.btn-primary:hover{ filter:brightness(1.08); }
.btn-primary[disabled]{ opacity:.5; cursor:default; }
.btn-primary svg{ width:16px; height:16px; fill:currentColor; }
.sheet-msg{ color:var(--accent); font-size:.85rem; }
.sheet-msg.err{ color:var(--saffron); }
#suggest{ cursor:pointer; }

.whole{ display:inline-flex; align-items:center; justify-content:center; gap:10px;
  font:inherit; font-size:.9rem; cursor:pointer; white-space:nowrap;
  background:none; color:var(--paper); border:1px solid var(--line);
  border-radius:999px; padding:11px 20px; transition:border-color .2s,color .2s,background .2s; }
.whole:hover{ border-color:var(--accent); color:var(--accent); }
.whole:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.whole[data-on="1"]{ background:var(--accent); border-color:var(--accent); color:var(--ink); }
.whole svg{ width:12px; height:12px; flex:none; fill:currentColor; }
.whole small{ opacity:.6; font-size:.8em; }

/* the spine — width of each segment ∝ chapter length */
.spine-wrap{ margin-top:26px; }
.spine{ display:flex; gap:2px; height:26px; align-items:stretch; }
.seg{ position:relative; flex:1 1 0; min-width:7px; padding:0; border:0; cursor:pointer;
  background:color-mix(in srgb,var(--accent) 17%,transparent);
  border-radius:2px; overflow:hidden; transition:background .2s ease; }
.seg:hover{ background:color-mix(in srgb,var(--accent) 40%,transparent); }
.seg:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.seg[data-done="1"]{ background:color-mix(in srgb,var(--accent) 34%,transparent); }
.seg[data-now="1"]{ background:color-mix(in srgb,var(--accent) 22%,transparent); }
.seg-fill{ position:absolute; inset-block:0; inset-inline-start:0; width:0; background:var(--accent); }

.spine-meta{ display:flex; justify-content:space-between; align-items:center;
  gap:16px; margin-top:12px; color:var(--haze); }
.toc-toggle{ font:inherit; background:none; border:0; cursor:pointer; color:var(--haze);
  display:inline-flex; align-items:center; gap:7px; padding:4px 0; }
.toc-toggle:hover{ color:var(--paper); }
.toc-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.toc-toggle svg{ width:10px; height:10px; fill:currentColor; transition:transform .25s ease; }
.toc-toggle[aria-expanded="true"] svg{ transform:rotate(180deg); }

/* chapter list */
.toc{ margin-top:20px; border-top:1px solid var(--line); }
.toc[hidden]{ display:none; }
.ch{ display:grid; grid-template-columns:auto 1fr auto auto; align-items:center;
  gap:16px; padding-block:11px; border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  background:none; border-inline:0; border-top:0; width:100%; text-align:start;
  font:inherit; color:var(--paper); cursor:pointer; transition:color .2s; }
.ch:hover{ color:var(--accent); }
.ch:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
.ch-n{ color:var(--haze); font-family:'JetBrains Mono',monospace; font-size:.78rem; font-variant-numeric:tabular-nums; }
.ch[data-now="1"] .ch-n, .ch[data-now="1"]{ color:var(--accent); }
.ch-t{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.96rem; }
.ch-d{ color:var(--haze); font-size:.8rem; white-space:nowrap; }
.ch-dl{ color:var(--haze); text-decoration:none; font-size:.75rem; padding-inline:6px; }
.ch-dl:hover{ color:var(--paper); }
.missing{ color:var(--haze); }

/* sticky player */
.player{ position:fixed; inset-inline:0; bottom:0; z-index:20;
  background:color-mix(in srgb,var(--ink-raise) 92%,transparent);
  backdrop-filter:blur(14px); border-top:1px solid var(--line);
  transform:translateY(110%); transition:transform .35s cubic-bezier(.16,1,.3,1); }
.player.on{ transform:none; }
.player-scrub{ height:3px; background:var(--line); cursor:pointer; position:relative; }
.player-scrub-fill{ position:absolute; inset-block:0; inset-inline-start:0; width:0; background:var(--accent); }
.player-body{ max-width:1000px; margin-inline:auto; padding:12px var(--gutter);
  display:flex; align-items:center; gap:16px; height:calc(var(--bar-h) - 3px); }
.pbtn{ font:inherit; background:none; border:0; cursor:pointer; color:var(--haze);
  padding:8px; display:inline-flex; border-radius:50%; transition:color .2s; }
.pbtn:hover{ color:var(--paper); }
.pbtn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.pbtn[disabled]{ opacity:.3; cursor:default; }
.pbtn svg{ width:15px; height:15px; fill:currentColor; }
.pbtn.main{ color:var(--ink); background:var(--accent); padding:11px; }
.pbtn.main:hover{ color:var(--ink); filter:brightness(1.1); }
html[dir="rtl"] .pbtn.flip svg{ transform:scaleX(-1); }
.pnow{ flex:1; min-width:0; }
.pnow b{ display:block; font-weight:500; font-size:.92rem; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.pnow span{ color:var(--haze); font-size:.78rem; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; display:block; }
.ptime{ color:var(--haze); font-family:'JetBrains Mono',monospace;
  font-variant-numeric:tabular-nums; font-size:.75rem; white-space:nowrap; }

.msg{ padding-block:80px; color:var(--haze); text-align:center; }
.err{ color:var(--saffron); }
footer{ padding-block:52px 64px; color:var(--haze); display:flex; flex-wrap:wrap;
  gap:10px 24px; justify-content:space-between; }
footer a{ color:var(--haze); text-decoration:none; border-bottom:1px solid var(--line); }
footer a:hover{ color:var(--paper); }

@media (max-width:680px){
  .book-top{ grid-template-columns:1fr; }
  .cover{ width:64px; }
  .whole{ width:100%; }
  .ch{ grid-template-columns:auto 1fr auto; }
  .ch-dl{ display:none; }
  .ptime{ display:none; }
  .pnow span{ display:none; }
}
@media (prefers-reduced-motion:reduce){ *{ transition-duration:.01ms !important; } html{ scroll-behavior:auto; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="mark"><span class="mark-dot" aria-hidden="true"></span><span class="mono" data-i18n="mark"></span></div>
    <div class="langswitch" role="group" aria-label="Language">
      <button type="button" data-setlang="fa" aria-pressed="true">فارسی</button>
      <button type="button" data-setlang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <section class="hero">
    <p class="eyebrow mono" data-i18n="eyebrow"></p>
    <h1 class="headline" id="headline"></h1>
    <p class="standfirst" data-i18n="standfirst"></p>
    <div class="stats" id="stats" hidden>
      <div class="stat"><b id="sBooks"></b><span class="mono" data-i18n="sBooks"></span></div>
      <div class="stat"><b id="sEps"></b><span class="mono" data-i18n="sEps"></span></div>
      <div class="stat is-key"><b id="sListen"></b><span class="mono" data-i18n="sListen"></span></div>
    </div>
  </section>

  <nav class="cats" id="cats" role="group" aria-label="Categories" hidden></nav>
  <main><div id="list"></div><div class="msg" id="msg" data-i18n="loading"></div></main>

  <footer class="mono">
    <span data-i18n="footnote"></span>
    <span>
      <a id="suggest" target="_blank" rel="noopener" data-i18n="suggest"></a>
      &nbsp;·&nbsp;
      <a id="repoLink" href="https://github.com/aminmirr/book-podcasts" target="_blank" rel="noopener">GitHub</a>
    </span>
  </footer>
</div>

<div class="player" id="player" role="region" aria-label="Player">
  <div class="player-scrub" id="scrub"><div class="player-scrub-fill" id="scrubFill"></div></div>
  <div class="player-body">
    <button type="button" class="pbtn flip" id="prev" data-i18n-label="prev"><svg viewBox="0 0 16 16"><path d="M13 2v12L5 8zM3 2h1.6v12H3z"/></svg></button>
    <button type="button" class="pbtn main" id="toggle" data-i18n-label="play"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></button>
    <button type="button" class="pbtn flip" id="next" data-i18n-label="next"><svg viewBox="0 0 16 16"><path d="M3 2v12l8-6zM11.4 2H13v12h-1.6z"/></svg></button>
    <div class="pnow"><b id="pTitle"></b><span id="pSub"></span></div>
    <div class="ptime"><span id="pCur">0:00</span> / <span id="pDur">0:00</span></div>
    <button type="button" class="pbtn" id="close" data-i18n-label="close"><svg viewBox="0 0 16 16"><path d="M12.7 4.4 9.1 8l3.6 3.6-1.1 1.1L8 9.1l-3.6 3.6-1.1-1.1L6.9 8 3.3 4.4l1.1-1.1L8 6.9l3.6-3.6z"/></svg></button>
  </div>
</div>

<dialog class="sheet" id="suggestDlg" aria-labelledby="suggestH">
  <button type="button" class="sheet-close" id="sheetClose" aria-label="Close">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.7 4.4 9.1 8l3.6 3.6-1.1 1.1L8 9.1l-3.6 3.6-1.1-1.1L6.9 8 3.3 4.4l1.1-1.1L8 6.9l3.6-3.6z"/></svg>
  </button>
  <!-- step 1: choose path -->
  <div class="sheet-panel" data-step="choose">
    <h3 id="suggestH" data-i18n="suggest"></h3>
    <p class="sheet-lead" data-i18n="sgLead"></p>
    <div class="sheet-actions col">
      <button type="button" class="btn-primary" id="pickGh">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.6 0 0 3.6 0 8c0 3.5 2.3 6.5 5.5 7.6.4.1.5-.2.5-.4v-1.4c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.3.7.1-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-3.9 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8.6-.2 1.3-.3 2-.3s1.4.1 2 .3c1.5-1 2.2-.8 2.2-.8.5 1.1.2 1.9.1 2.1.5.5.8 1.2.8 2.1 0 3-1.8 3.7-3.6 3.9.3.3.6.8.6 1.6v2.4c0 .2.1.5.6.4A8 8 0 0 0 16 8c0-4.4-3.6-8-8-8z"/></svg>
        <span data-i18n="sgGithub"></span>
      </button>
      <button type="button" class="btn-ghost" id="pickAnon" data-i18n="sgAnon"></button>
    </div>
  </div>

  <!-- step 2 (GitHub path): offer a star -->
  <div class="sheet-panel" data-step="star" hidden>
    <h3 data-i18n="sgStarH"></h3>
    <p class="sheet-lead" data-i18n="sgStarLead"></p>
    <div class="sheet-actions col">
      <button type="button" class="btn-ghost" id="starYes" data-i18n="sgStarYes"></button>
      <button type="button" class="btn-ghost" id="starNo" data-i18n="sgStarNo"></button>
    </div>
  </div>

  <!-- after "Yes, star it": stays open so they can star on return -->
  <div class="sheet-panel" data-step="links" hidden>
    <h3 data-i18n="sgOpenH"></h3>
    <p class="sheet-lead" data-i18n="sgOpenLead"></p>
    <div class="sheet-actions col">
      <a class="btn-primary" id="lnkStar"  target="_blank" rel="noopener" data-i18n="sgStarLink"></a>
      <a class="btn-ghost"   id="lnkIssue" target="_blank" rel="noopener" data-i18n="sgOpenIssue"></a>
    </div>
  </div>

  <!-- anonymous path: Supabase form -->
  <form id="suggestForm" class="sheet-panel" data-step="form" hidden>
    <h3 data-i18n="suggest"></h3>
    <label><span data-i18n="fTitle"></span><input name="title" maxlength="200" required autocomplete="off"></label>

function dur(secs){

/* split a book's episodes for the current language into {full, chapters[]} */
function split(book){
  const eps = (book.episodes && book.episodes[langKey()]) || [];
  return { full: eps.find(isWhole) || null,
           chapters: eps.filter(e=>!isWhole(e)) };
}

/* ---------------- render ---------------- */
function render(){
  const L=t();
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==="fa"?"rtl":"ltr";
  document.documentElement.dataset.lang=LANG;
  document.title = LANG==="fa" ? "خلاصه‌های صوتی کتاب" : "Audio Book Summaries";
  $$("[data-i18n]").forEach(e=>e.textContent=L[e.dataset.i18n]||"");
  $$("[data-i18n-label]").forEach(e=>e.setAttribute("aria-label",L[e.dataset.i18nLabel]||""));
  $("#headline").innerHTML=L.headline;
  $$("[data-setlang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.setlang===LANG)));
  if(!DATA) return;

  const books=DATA.books||[];
  if(!books.length){ $("#msg").textContent=L.empty; return; }

  let eps=0, listen=0;
  books.forEach(b=>{
    const {full,chapters}=split(b);
    if(full){ eps++; listen += full.seconds||0; }
    chapters.forEach(c=>{ eps++; listen += c.seconds||0; });
  });
  $("#sBooks").textContent=num(books.length);
  $("#sEps").textContent=num(eps);
  $("#sListen").textContent=dur(listen);
  $("#stats").hidden=false; $("#msg").hidden=true;

  renderCats(books);
  const shown = CAT ? books.filter(b=>bookCats(b.slug).includes(CAT)) : books;

  const open = new Set($$(".toc-toggle[aria-expanded='true']").map(b=>b.dataset.slug));
  for(const k in refs) delete refs[k];
  $("#list").innerHTML="";
  shown.forEach(b=>$("#list").append(bookEl(b, open.has(b.slug))));
  paintSpines();
  paintVotes();
}

function renderCats(books){
  const all = [...new Set(books.flatMap(b=>bookCats(b.slug)))].sort((a,b)=>a.localeCompare(b));
  const nav = $("#cats");
  if(!all.length){ nav.hidden=true; nav.innerHTML=""; return; }
  nav.hidden=false;
  const chip = (label,val,on)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="cat"; b.textContent=label;
    b.setAttribute("aria-pressed",String(on));
    b.addEventListener("click",()=>{ CAT = (CAT===val)?null:val; render(); });
    return b;
  };
  nav.innerHTML="";
  nav.append(chip(t().all,null,CAT===null));
  all.forEach(c=>nav.append(chip(c,c,CAT===c)));
}

function bookEl(b, openToc){
  const L=t(), {full,chapters}=split(b);
  const el=document.createElement("article"); el.className="book";
  const chMin=chapters.reduce((s,c)=>s+(c.seconds||0),0);

  const m = META[b.slug] || {};
  const titleEn = m.title_en || b.title || b.slug;
  const titleFa = m.title_fa || "";
  const author  = m.author || "";
  const cover   = m.cover || "";
  const note    = (LANG==="fa" ? m.note_fa : m.note_en) || "";

  el.innerHTML=`
    <div class="book-top">
      <div class="book-id">
        ${cover?`<img class="cover" src="${esc(cover)}" alt="" loading="lazy" onerror="this.remove()">`:""}
        <div class="titles">
          <h2 class="book-title-en">${esc(titleEn)}</h2>
          ${titleFa?`<p class="book-title-fa">${esc(titleFa)}</p>`:""}
          ${author?`<p class="book-author">${esc(author)}</p>`:""}
          ${note?`<p class="book-note">${esc(note)}</p>`:""}
          <div class="book-cats"></div>
        </div>
      </div>
      <div class="book-side"></div>
    </div>
    <div class="spine-wrap">
      <div class="spine" role="group" aria-label="${esc(L.chapters)}"></div>
      <div class="spine-meta">
        <button type="button" class="toc-toggle mono" data-slug="${esc(b.slug)}" aria-expanded="${openToc}">
          ${ICON_CHEV}<span class="toc-label"></span>
        </button>
        <span class="mono">${num(chapters.length)} ${L.chapters} · ${dur(chMin)}</span>
      </div>
      <div class="toc" ${openToc?"":"hidden"}></div>
    </div>`;

  const R = refs[b.slug] = { segs:[], fills:[], chs:[], whole:null };

  // per-book category chips (clickable → filter)
  const catBox=$(".book-cats",el), cats=bookCats(b.slug).slice(0,3);
  if(cats.length){
    cats.forEach(c=>{
      const cb=document.createElement("button");
      cb.type="button"; cb.className="cat"; cb.textContent=c;
      cb.setAttribute("aria-pressed",String(CAT===c));
      cb.addEventListener("click",()=>{ CAT=(CAT===c)?null:c; render(); scrollTo({top:0,behavior:"smooth"}); });
      catBox.append(cb);
    });
  } else catBox.remove();

  // like / dislike
  const votesBox=document.createElement("div"); votesBox.className="votes";
  const mkVote=(icon,val,label)=>{
    const btn=document.createElement("button");
    btn.type="button"; btn.className="vote"; btn.setAttribute("aria-label",label);
    btn.innerHTML=`${icon}<span class="num">0</span>`;
    btn.addEventListener("click",()=>castVote(b.slug, val));
    return btn;
  };
  const up=mkVote(ICON_UP,1,L.like), down=mkVote(ICON_DOWN,-1,L.dislike);
  votesBox.append(up,down);
  $(".titles",el).append(votesBox);
  R.vote={ up, down, upN:$(".num",up), downN:$(".num",down) };

  // whole-book: play + download
  const side=$(".book-side",el);
  if(full){
    const w=document.createElement("button");
    w.type="button"; w.className="whole"; w.dataset.on="0";
    w.innerHTML=`${ICON_PLAY}<span>${esc(L.whole)}</span><small>${dur(full.seconds)}</small>`;
    w.addEventListener("click",()=>{
      if(cur()?.slug===b.slug && cur()?.kind==="full"){ audio.paused?audio.play():audio.pause(); return; }
      start([mkTrack(b,"full",full,0)],0);
    });
    side.append(w); R.whole=w;
    const dl=document.createElement("a");
    dl.className="whole-dl"; dl.href=full.url; dl.setAttribute("download","");
    dl.title=L.dlWhole; dl.setAttribute("aria-label",L.dlWhole); dl.innerHTML=ICON_DL;
    side.append(dl);
  } else {
    side.innerHTML=`<span class="mono missing">${esc(L.missing)}</span>`;
  }

  // spine + toc, segment width ∝ chapter length
  const spine=$(".spine",el), toc=$(".toc",el);
  const tracks=chapters.map((c,i)=>mkTrack(b,"chapter",c,i));
  chapters.forEach((c,i)=>{
    const title=chTitle(b.slug,c);
    const seg=document.createElement("button");
    seg.type="button"; seg.className="seg";
    seg.style.flexGrow=String(Math.max((c.seconds||60)/60,1));
    seg.title=`${L.chShort} ${num(i+1)} — ${title}`;   // hover: no duration
    seg.setAttribute("aria-label",seg.title);
    seg.innerHTML=`<span class="seg-fill"></span>`;
    seg.addEventListener("click",()=>start(tracks,i));
    spine.append(seg);
    R.segs.push(seg); R.fills.push($(".seg-fill",seg));

    const row=document.createElement("button");
    row.type="button"; row.className="ch";
    row.innerHTML=`<span class="ch-n">${String(i+1).padStart(2,"0")}</span>
      <span class="ch-t">${esc(title)}</span>

      <a class="ch-dl mono" href="${esc(c.url)}" download title="${esc(L.download)}">↓</a>`;
    row.addEventListener("click",e=>{ if(e.target.closest(".ch-dl")) return; start(tracks,i); });
    toc.append(row); R.chs.push(row);
  });

  const tog=$(".toc-toggle",el);
  const setLabel=()=>$(".toc-label",tog).textContent =
    tog.getAttribute("aria-expanded")==="true" ? L.hideToc : L.showToc;
  setLabel();
  tog.addEventListener("click",()=>{
    const on=tog.getAttribute("aria-expanded")==="true";
    tog.setAttribute("aria-expanded",String(!on));
    toc.hidden=on; setLabel();
  });
  if(!chapters.length){ $(".spine-wrap",el).style.display="none"; }
  return el;

function mkTrack(b,kind,ep,idx){
  return { slug:b.slug, kind, idx,
    book:(META[b.slug]&&META[b.slug].title_en)||b.title||b.slug,
    label: kind==="full" ? t().whole : `${t().chShort} ${num(idx+1)} — ${chTitle(b.slug,ep)}`,
    src:ep.url };
}

/* ---------------- playback ---------------- */
const cur = ()=>queue[qi];
function start(list,i){ queue=list; qi=i; load(true); }
function load(autoplay){
  const tr=cur(); if(!tr) return;
  audio.src=tr.src;
  $("#pTitle").textContent=tr.label; $("#pTitle").classList.remove("err");
  $("#pSub").textContent=tr.book;
  $("#player").classList.add("on"); document.body.classList.add("has-player");
  $("#prev").disabled = qi<=0;
  $("#next").disabled = qi>=queue.length-1;
  if(autoplay) audio.play().catch(fail);
  paintSpines();
}
function fail(){ $("#pTitle").textContent=t().notfound; $("#pTitle").classList.add("err"); paintSpines(); }
function paintSpines(){
  const tr=cur();
  for(const slug in refs){
    const R=refs[slug];
    R.whole && (R.whole.dataset.on = (tr&&tr.slug===slug&&tr.kind==="full"&&!audio.paused)?"1":"0");
    R.segs.forEach((s,i)=>{
      const now = tr&&tr.slug===slug&&tr.kind==="chapter"&&tr.idx===i;
      s.dataset.now = now?"1":"0";
      if(!now) R.fills[i].style.width="0";
      R.chs[i] && (R.chs[i].dataset.now = now?"1":"0");
    });
  }
  const on=!audio.paused;
  $("#toggle").innerHTML = on?ICON_PAUSE:ICON_PLAY;
  $("#toggle").setAttribute("aria-label", on?t().pause:t().play);
}

audio.addEventListener("play",paintSpines);
audio.addEventListener("pause",paintSpines);
audio.addEventListener("error",()=>{ if(audio.src) fail(); });
audio.addEventListener("ended",()=>{
  const tr=cur();
  if(tr){ const R=refs[tr.slug]; if(R&&tr.kind==="chapter") R.segs[tr.idx].dataset.done="1"; }
  if(qi<queue.length-1){ qi++; load(true); } else { paintSpines(); }
});
audio.addEventListener("timeupdate",()=>{
  if(!audio.duration) return;
  const p=audio.currentTime/audio.duration;
  $("#scrubFill").style.width=p*100+"%";
  $("#pCur").textContent=clock(audio.currentTime);
  $("#pDur").textContent=clock(audio.duration);
  const tr=cur();
  if(tr&&tr.kind==="chapter"){ const R=refs[tr.slug]; R&&R.fills[tr.idx]&&(R.fills[tr.idx].style.width=p*100+"%"); }
});

$("#toggle").addEventListener("click",()=>audio.paused?audio.play().catch(fail):audio.pause());
$("#prev").addEventListener("click",()=>{ if(qi>0){ qi--; load(true); } });
$("#next").addEventListener("click",()=>{ if(qi<queue.length-1){ qi++; load(true); } });
$("#close").addEventListener("click",()=>{
  audio.pause(); audio.removeAttribute("src"); queue=[]; qi=-1;
  $("#player").classList.remove("on"); document.body.classList.remove("has-player");
  paintSpines();
});
$("#scrub").addEventListener("click",e=>{
  if(!audio.duration) return;
  const r=e.currentTarget.getBoundingClientRect();
  const x = document.dir==="rtl" ? r.right-e.clientX : e.clientX-r.left;
  audio.currentTime = Math.min(Math.max(x/r.width,0),1)*audio.duration;
});
document.addEventListener("keydown",e=>{
  if(e.code==="Space" && cur() && !/^(BUTTON|A|INPUT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); audio.paused?audio.play().catch(fail):audio.pause();
  }
});

/* language switch keeps your place */
$$("[data-setlang]").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.setlang===LANG) return;
  const tr=cur(), ratio = audio.duration ? audio.currentTime/audio.duration : 0;
  const keep = tr ? {slug:tr.slug, kind:tr.kind, idx:tr.idx, playing:!audio.paused} : null;
  LANG=b.dataset.setlang; localStorage.setItem("abs-lang",LANG);
  audio.pause(); queue=[]; qi=-1;
  render();
  if(keep) resume(keep, ratio);
  else { $("#player").classList.remove("on"); document.body.classList.remove("has-player"); }
}));

function resume(keep, ratio){
  const b=(DATA.books||[]).find(x=>x.slug===keep.slug); if(!b) return;
  const {full,chapters}=split(b);
  if(keep.kind==="full"){
    if(!full) return; queue=[mkTrack(b,"full",full,0)]; qi=0;
  } else {
    if(!chapters[keep.idx]) return;
    queue=chapters.map((c,i)=>mkTrack(b,"chapter",c,i)); qi=keep.idx;
  }
  load(false);
  audio.addEventListener("loadedmetadata",()=>{ if(audio.duration) audio.currentTime=ratio*audio.duration; },{once:true});
  if(keep.playing) audio.play().catch(fail);
}

/* ---------------- likes / dislikes (Supabase) ---------------- */
function paintVotes(){
  for(const slug in refs){
    const R=refs[slug]; if(!R.vote) continue;
    const v=VOTES[slug]||{up:0,down:0}, mine=MYVOTE[slug];
    R.vote.upN.textContent=num(v.up); R.vote.downN.textContent=num(v.down);
    R.vote.up.setAttribute("aria-pressed",String(mine===1));
    R.vote.down.setAttribute("aria-pressed",String(mine===-1));
  }
}
async function loadVotes(){
  try{
    const [all,mine]=await Promise.all([
      fetch(SB_URL+"/votes?select=slug,value",{headers:SB_H}).then(r=>r.json()),
      fetch(SB_URL+"/votes?select=slug,value&voter=eq."+voterId(),{headers:SB_H}).then(r=>r.json()),
    ]);
    VOTES={}; (all||[]).forEach(r=>{ const v=VOTES[r.slug]||(VOTES[r.slug]={up:0,down:0}); r.value===1?v.up++:v.down++; });
    MYVOTE={}; (mine||[]).forEach(r=>MYVOTE[r.slug]=r.value);
    paintVotes();
  }catch{ /* offline → counts stay at 0 */ }
}
async function castVote(slug,value){
  const prev=MYVOTE[slug];
  if(prev===value) return;                 // no un-vote (delete is blocked by design)
  const v=VOTES[slug]||(VOTES[slug]={up:0,down:0});
  const apply=(pv,nv)=>{ if(pv===1)v.up--; if(pv===-1)v.down--; if(nv===1)v.up++; if(nv===-1)v.down++; };
  apply(prev,value); MYVOTE[slug]=value; paintVotes();   // optimistic
  try{
    const r=await fetch(SB_URL+"/votes",{ method:"POST",
      headers:{...SB_H,"Prefer":"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({slug,voter:voterId(),value}) });
    if(!r.ok) throw 0;
  }catch{ apply(value,prev); MYVOTE[slug]=prev; paintVotes(); }  // revert
}

/* ---------------- suggestion sheet (choose → GitHub or anonymous) ---------------- */
const dlg=$("#suggestDlg"), sForm=$("#suggestForm"), sMsg=$("#suggestMsg");
const REPO_URL="https://github.com/aminmirr/book-podcasts";
// withStar → append the "go back and click Star" reminder to the issue body
const issueUrl=withStar=> REPO_URL+"/issues/new?labels=suggestion"
  + "&title="+encodeURIComponent(t().issueTitle)
  + "&body=" +encodeURIComponent(t().issueBody + (withStar ? t().starNote : ""));
const showPanel=name=>$$(".sheet-panel",dlg).forEach(p=>p.hidden=p.dataset.step!==name);
const openTab=url=>{ const w=window.open(url,"_blank"); if(w) w.opener=null; return w; };
function openSuggest(){ sMsg.hidden=true; sForm.reset(); showPanel("choose"); if(dlg.showModal) dlg.showModal(); }

$("#suggest").addEventListener("click",e=>{ e.preventDefault(); openSuggest(); });
$("#sheetClose").addEventListener("click",()=>dlg.close());
$("#pickAnon").addEventListener("click",()=>{ sMsg.hidden=true; showPanel("form"); });
$("#pickGh").addEventListener("click",()=>showPanel("star"));

// "No, just suggest" → open the suggestion page and close the box
$("#starNo").addEventListener("click",()=>{
  const url=issueUrl(false);
  if(openTab(url)){ dlg.close(); return; }
  $("#lnkIssue").href=url; $("#lnkStar").hidden=true; showPanel("links");   // popup blocked → tappable link
});
// "Yes, star it" → open the suggestion page, but KEEP the box open with a
// "Go to starring page" link (the issue body tells them to come back and tap it)
$("#starYes").addEventListener("click",()=>{
  const url=issueUrl(true);
  openTab(url);
  $("#lnkStar").href=REPO_URL; $("#lnkStar").hidden=false;
  $("#lnkIssue").href=url;
  showPanel("links");            // stays open; do NOT close here
});
// tapping either link closes the box
$("#lnkStar").addEventListener("click",()=>dlg.close());
$("#lnkIssue").addEventListener("click",()=>dlg.close());
$("#suggestCancel").addEventListener("click",()=>dlg.close());
sForm.addEventListener("submit",async e=>{
  e.preventDefault();
  const fd=new FormData(sForm), title=(fd.get("title")||"").trim();
  if(!title) return;
  const btn=$("#suggestSend"); btn.disabled=true; sMsg.hidden=false; sMsg.classList.remove("err"); sMsg.textContent=t().sending;
  try{
    const r=await fetch(SB_URL+"/suggestions",{ method:"POST",
      headers:{...SB_H,"Prefer":"return=minimal"},
      body:JSON.stringify({ title, author:(fd.get("author")||"").trim()||null,
        lang:LANG, why:(fd.get("why")||"").trim()||null }) });
    if(!r.ok) throw 0;
    sMsg.textContent=t().sent; sForm.reset();
    setTimeout(()=>dlg.close(),1300);
  }catch{ sMsg.classList.add("err"); sMsg.textContent=t().sendErr; }
  finally{ btn.disabled=false; }
});

/* boot — manifest is required (generated); books.meta.json is optional (hand-edited) */
Promise.all([
  fetch("manifest.json?"+Date.now()).then(r=>{ if(!r.ok) throw 0; return r.json(); }),
  fetch("books.meta.json?"+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
])
  .then(([d,meta])=>{ DATA=d; META=meta||{}; render(); loadVotes(); })
  .catch(()=>{ render(); const m=$("#msg"); m.hidden=false; m.textContent=t().error; });
</script>
