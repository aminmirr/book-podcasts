<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Podcasts</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#e8e8ea; --mut:#9aa0aa; --acc:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:2rem 1rem 1rem; text-align:center; }
  header h1 { margin:0; font-size:1.6rem; }
  header p { margin:.4rem 0 0; color:var(--mut); }
  main { max-width:820px; margin:0 auto; padding:1rem; }
  .book { background:var(--card); border-radius:12px; padding:1rem 1.25rem; margin:1rem 0; }
  .book > summary { font-size:1.15rem; font-weight:600; cursor:pointer; list-style:none; }
  .book > summary::-webkit-details-marker { display:none; }
  .book > summary::before { content:"▸ "; color:var(--acc); }
  .book[open] > summary::before { content:"▾ "; }
  .lang { margin:1rem 0 .25rem; color:var(--acc); font-weight:600; font-size:.85rem;
          text-transform:uppercase; letter-spacing:.05em; }
  .ep { padding:.6rem 0; border-top:1px solid #2a2e37; }
  .ep .t { margin:0 0 .35rem; font-size:.95rem; }
  .ep audio { width:100%; height:36px; }
  .fa .t, .fa audio { direction:rtl; }
  footer { text-align:center; color:var(--mut); padding:2rem 1rem; font-size:.85rem; }
  a { color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>📚 Book Podcasts</h1>
  <p>AI-generated audio summaries, chapter by chapter — English & Persian.</p>
</header>
<main id="app">Loading…</main>
<footer>Audio hosted on GitHub Releases · generated with NotebookLM</footer>
<script>
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('manifest.json?' + Date.now())
  .then(r => r.json())
  .then(m => {
    const app = document.getElementById('app');
    if (!m.books || !m.books.length) { app.textContent = 'No books published yet.'; return; }
    app.innerHTML = m.books.map(b => {
      const langs = Object.entries(b.episodes).map(([lang, eps]) => {
        const rtl = lang === 'Persian' ? ' fa' : '';
        const items = eps.map(e => `
          <div class="ep${rtl}">
            <p class="t">${esc(e.title)}</p>
            <audio controls preload="none" src="${esc(e.url)}"></audio>
          </div>`).join('');
        return `<div class="lang">${esc(lang)}</div>${items}`;
      }).join('');
      return `<details class="book"><summary>${esc(b.title)}</summary>${langs}</details>`;
    }).join('');
    if (m.books.length === 1) app.querySelector('details').open = true;
  })
  .catch(e => { document.getElementById('app').textContent = 'Failed to load manifest: ' + e; });
</script>
</body>
</html>
